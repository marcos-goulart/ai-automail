<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>⚡ AI AutoMail</title>
  <!-- Favicon customizado usando a codificação segura (URL-encode) do emoji de raio ⚡ -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='0.9em'%20font-size='90'%3E⚡%3C/text%3E%3C/svg%3E">
  <!-- Folha de estilos CSS contendo o layout e as animações da interface -->
  <link rel="stylesheet" href="../static/style.css">
</head>

<body>

  <!-- Tela de Splash (Tela de Apresentação Inicial que some após 2 segundos) -->
  <div id="splash">
    <div class="logo">
      ⚡ <span>AI AutoMail</span>
    </div>
  </div>

  <!-- Tela de Sobreposição de Arraste (Filtro desfocado exibido quando o usuário arrasta arquivos) -->
  <div id="drag-overlay" class="drag-overlay">
    <div class="drag-overlay-content">
      <div class="drag-icon">📥</div>
      <h2>Solte o arquivo para analisar</h2>
      <p>Apenas arquivos .txt ou .pdf são aceitos</p>
    </div>
  </div>

  <!-- Estrutura Principal da Interface do Usuário (Inicialmente oculta durante a splash screen) -->
  <main id="main" class="hidden">
    
    <!-- Seção revelada de forma animada via JS Intersection Observer -->
    <section class="reveal">
      <h1>Classificação Inteligente de Emails</h1>

      <!-- Formulário de captura com área de digitação e botão de upload customizado -->
      <form id="form">
        <textarea
          name="text"
          placeholder="Digite o conteúdo do email aqui..."
        ></textarea>

        <!-- Container flexbox para alinhar os botões de ação na mesma linha horizontal -->
        <div class="form-actions">
          <!-- Wrapper para o input de arquivos oculto e sua label estilizada de upload -->
          <div class="file-upload-wrapper">
            <input type="file" id="file-input" name="file" accept=".txt,.pdf" class="file-input-hidden">
            <label for="file-input" class="file-upload-btn">
              <span class="upload-icon">📁</span>
              <span class="upload-text">Selecionar arquivo</span>
            </label>
            <span id="file-name-display" class="file-name">Nenhum arquivo selecionado</span>
          </div>

          <!-- Botão de envio para disparar a análise do e-mail no backend -->
          <button type="submit">Processar Email</button>
        </div>
      </form>

      <!-- Card de exibição do resultado da IA (Oculto inicialmente, revelado após o processamento) -->
      <div id="result-card" class="card hidden">
        <h3>Resultado</h3>
        <pre id="output"></pre>
        <!-- Botão para copiar o e-mail automático sugerido para a área de transferência -->
        <button id="copy-btn">Copiar resposta</button>
      </div>
    </section>
  </main>
  
  <!-- Lógica Javascript responsável pelas interações, animação de pontos e consumo de API -->
  <script src="../static/app.js"></script> 
</body>
</html>
